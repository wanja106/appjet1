<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dropship Sales Tracker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">◈</span>
        <div>
          <h1>Dropship Sales Tracker</h1>
          <p class="tagline">Track sales of any product, in any market</p>
        </div>
      </div>
      <div class="filters">
        <label>
          <span>Product</span>
          <select id="product-select" aria-label="Product"></select>
        </label>
        <label>
          <span>Market</span>
          <select id="market-select" aria-label="Market"></select>
        </label>
      </div>
    </header>

    <main>
      <section class="cards" id="summary-cards" aria-live="polite"></section>

      <div class="columns">
        <section class="panel">
          <h2>Sales by market</h2>
          <p class="hint" id="market-hint">Units and revenue for the selected product.</p>
          <div id="market-breakdown"></div>
        </section>

        <section class="panel">
          <h2>Log a sale</h2>
          <form id="sale-form" class="sale-form">
            <label>Product
              <select name="productId" id="form-product" required></select>
            </label>
            <label>Market
              <select name="marketCode" id="form-market" required></select>
            </label>
            <div class="row">
              <label>Quantity
                <input type="number" name="quantity" min="1" step="1" value="1" required />
              </label>
              <label>Unit price (market currency)
                <input type="number" name="unitPrice" min="0" step="0.01" placeholder="auto from base price" />
              </label>
            </div>
            <div class="row">
              <label>Sale date
                <input type="date" name="soldAt" />
              </label>
              <label>Channel
                <input type="text" name="channel" placeholder="Shopify" />
              </label>
            </div>
            <label>Order reference
              <input type="text" name="orderRef" placeholder="ORD-1042" />
            </label>
            <button type="submit" id="submit-sale">Record sale</button>
            <p class="form-status" id="form-status" role="status"></p>
          </form>
        </section>
      </div>

      <section class="panel">
        <h2>Recent sales</h2>
        <p class="hint" id="recent-hint"></p>
        <div class="table-wrap">
          <table id="sales-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Market</th>
                <th class="num">Qty</th>
                <th class="num">Unit price</th>
                <th class="num">Line total</th>
                <th class="num">USD</th>
                <th>Channel</th>
                <th>Order</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
